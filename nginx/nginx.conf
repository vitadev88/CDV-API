events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name toolhubvn.duckdns.org;

        # Certbot webroot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect tất cả traffic khác sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name toolhubvn.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/toolhubvn.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/toolhubvn.duckdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 10M;

        location / {
            proxy_pass         http://app:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
