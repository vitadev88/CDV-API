name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/congdongviet-api

jobs:

  # ─────────────────────────────────────────
  # Job 1: Build JAR + Run Tests
  # ─────────────────────────────────────────
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn clean verify -B

  # ─────────────────────────────────────────
  # Job 2: Build Docker Image + Push Docker Hub
  # ─────────────────────────────────────────
  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────
  # Job 3: Deploy to EC2
  # ─────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push-docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Mở port 22 tạm thời cho GitHub Actions runner
      - name: Allow runner IP in EC2 Security Group
        id: allow-ip
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "runner_ip=$RUNNER_IP" >> $GITHUB_OUTPUT
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${RUNNER_IP}/32 || echo "Rule already exists, continuing..."
          echo "Waiting 10s for Security Group rule to propagate..."
          sleep 10

      # Dọn thư mục nginx cũ trước khi copy
      - name: Clean nginx directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 2m
          script: |
            rm -rf /home/${{ secrets.EC2_USER }}/app/nginx/nginx.conf
            mkdir -p /home/${{ secrets.EC2_USER }}/app/nginx

      # Copy docker-compose và nginx config lên EC2
      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: "/home/${{ secrets.EC2_USER }}/app"
          timeout: 60s
          overwrite: true

      # Deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd /home/${{ secrets.EC2_USER }}/app

            # Tạo file .env từ GitHub Secrets
            cat > .env << 'EOF'
            DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}

            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION=${{ secrets.JWT_EXPIRATION }}

            REDIS_HOST=redis
            REDIS_PORT=6379
            REDIS_PASSWORD=

            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_PHONE_NUMBER=${{ secrets.TWILIO_PHONE_NUMBER }}

            SUPER_ADMIN_USERNAME=${{ secrets.SUPER_ADMIN_USERNAME }}
            SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
            SUPER_ADMIN_PHONE=${{ secrets.SUPER_ADMIN_PHONE }}
            EOF

            # Tạo SSL cert tự ký nếu chưa có
            mkdir -p nginx/ssl
            if [ ! -f nginx/ssl/fullchain.pem ]; then
              openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout nginx/ssl/privkey.pem \
                -out nginx/ssl/fullchain.pem \
                -subj "/CN=${{ secrets.EC2_HOST }}" \
                -addext "subjectAltName=IP:${{ secrets.EC2_HOST }}"
              echo "SSL certificate generated"
            else
              echo "SSL certificate already exists"
            fi

            # Pull image mới nhất
            docker pull ${{ env.DOCKER_IMAGE }}:latest

            # Restart toàn bộ stack
            docker compose -f docker-compose.prod.yml down || true
            docker compose -f docker-compose.prod.yml up -d

            # Xóa image cũ
            docker image prune -f

            echo "✅ Deploy thành công: $(date)"
            docker ps

      # Đóng port 22 lại dù thành công hay thất bại
      - name: Revoke runner IP from EC2 Security Group
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.EC2_SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.allow-ip.outputs.runner_ip }}/32 || true
          echo "Revoked runner IP from port 22"
